apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixbot-backstage
  namespace: fixbot
  labels:
    app: fixbot-backstage
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fixbot-backstage
  template:
    metadata:
      labels:
        app: fixbot-backstage
    spec:
      containers:
        - name: backstage
          image: fdhliakbar/fixbot-backstage:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 7007
              name: http
          env:
            # Application URLs
            - name: APP_BASE_URL
              value: 'https://fixbot.hackathon.sev-2.com'
            - name: BACKEND_BASE_URL
              value: 'https://fixbot.hackathon.sev-2.com'
            
            # Database
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: fixbot-db-secret
                  key: host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: fixbot-db-secret
                  key: port
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: fixbot-db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fixbot-db-secret
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: fixbot-db-secret
                  key: database
            
            # API Keys
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fixbot-api-secret
                  key: claude-api-key
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fixbot-api-secret
                  key: claude-api-key
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: fixbot-github-secret
                  key: client-id
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fixbot-github-secret
                  key: client-secret
            - name: BOT_USERNAME
              value: 'CodeReina'
            
            # Node
            - name: NODE_ENV
              value: 'production'
            - name: NODE_OPTIONS
              value: '--max-old-space-size=1536'
          
          resources:
            requests:
              memory: '768Mi'
              cpu: '300m'
            limits:
              memory: '2Gi'
              cpu: '1000m'
          
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 7007
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 7007
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
